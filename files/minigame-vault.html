<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>🔐 魔法金庫</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #312e81 0%,
            #0f172a 50%,
            #020617 100%
        );

    color: white;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.game {
    width: min(94vw, 480px);
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.subtitle {
    margin: 4px 0 15px;

    color: #c4b5fd;
    font-size: 14px;
}

.status {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;

    margin-bottom: 15px;
}

.statusBox {
    background: rgba(255,255,255,0.08);

    border:
        1px solid rgba(255,255,255,0.15);

    border-radius: 12px;

    padding: 8px;
}

.statusLabel {
    font-size: 11px;
    color: #a5b4fc;
}

.statusValue {
    font-size: 20px;
    font-weight: bold;
}


/* =========================
   魔法陣
========================= */

.magicCircle {
    width: min(82vw, 370px);
    aspect-ratio: 1;

    margin: 0 auto 18px;

    position: relative;

    border-radius: 50%;

    border:
        3px solid rgba(167,139,250,0.8);

    box-shadow:
        0 0 20px rgba(139,92,246,0.4),
        inset 0 0 30px rgba(139,92,246,0.2);

    transition: 0.3s;
}

.magicCircle::before {
    content: "";

    position: absolute;

    inset: 22px;

    border:
        2px dashed rgba(196,181,253,0.5);

    border-radius: 50%;

    animation: rotate 15s linear infinite;
}

.magicCircle::after {
    content: "";

    position: absolute;

    inset: 65px;

    border:
        1px solid rgba(167,139,250,0.5);

    transform: rotate(45deg);
}

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   魔法アイコン
========================= */

.magicCore {
    position: absolute;

    inset: 0;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    z-index: 5;
}

.lock {
    font-size: 55px;

    filter:
        drop-shadow(
            0 0 12px rgba(196,181,253,0.8)
        );
}

.sealText {
    margin-top: 8px;

    font-size: 18px;
    font-weight: bold;
}


/* =========================
   手順
========================= */

.sequence {
    position: absolute;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    display: flex;

    gap: 8px;

    z-index: 10;
}

.step {
    width: 42px;
    height: 42px;

    border-radius: 10px;

    background: rgba(255,255,255,0.08);

    border:
        2px solid rgba(255,255,255,0.15);

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 22px;

    transition: 0.2s;
}

.step.current {
    border-color: #facc15;

    background:
        rgba(250,204,21,0.2);

    transform: scale(1.15);

    box-shadow:
        0 0 15px rgba(250,204,21,0.7);
}

.step.done {
    border-color: #22c55e;

    background:
        rgba(34,197,94,0.25);
}

.step.wrong {
    border-color: #ef4444;

    background:
        rgba(239,68,68,0.25);
}


/* =========================
   メッセージ
========================= */

.message {
    min-height: 28px;

    margin-bottom: 10px;

    font-size: 16px;
    font-weight: bold;
}


/* =========================
   ボタン
========================= */

.buttons {
    display: flex;

    gap: 8px;
}

button {
    flex: 1;

    border: none;

    border-radius: 12px;

    padding: 14px 8px;

    font-size: 15px;
    font-weight: bold;

    color: white;

    background: #7c3aed;
}

button:active {
    transform: scale(0.97);
}

button:disabled {
    opacity: 0.5;
}

#sensorBtn {
    background: #2563eb;
}

#startBtn {
    background: #9333ea;
}

#resetBtn {
    background: #475569;
}

.help {
    margin-top: 10px;

    color: #94a3b8;

    font-size: 11px;
}


/* =========================
   クリア画面
========================= */

.overlay {
    position: fixed;

    inset: 0;

    background:
        rgba(2,6,23,0.88);

    display: none;

    justify-content: center;
    align-items: center;

    z-index: 100;
}

.overlay.show {
    display: flex;
}

.result {
    width: min(88vw, 380px);

    padding: 35px 20px;

    background:
        linear-gradient(
            145deg,
            #312e81,
            #111827
        );

    border-radius: 22px;

    border:
        1px solid rgba(196,181,253,0.4);

    text-align: center;

    box-shadow:
        0 0 50px rgba(124,58,237,0.6);
}

.result h2 {
    margin: 0 0 15px;

    font-size: 34px;
}

.result p {
    line-height: 1.8;

    color: #cbd5e1;
}

#againBtn {
    margin-top: 10px;

    background: #22c55e;
}


/* =========================
   開錠演出
========================= */

.opening {
    animation:
        unlock 1s ease;
}

@keyframes unlock {

    0% {
        transform: scale(1);
        filter: brightness(1);
    }

    50% {
        transform: scale(1.12);
        filter: brightness(2);
    }

    100% {
        transform: scale(1);
        filter: brightness(1);
    }

}

</style>
</head>


<body>

<div class="game">

    <h1>🔐 魔法金庫</h1>

    <div class="subtitle">
        魔法陣を完成させて封印を解除せよ
    </div>


    <!-- ステータス -->

    <div class="status">

        <div class="statusBox">

            <div class="statusLabel">
                封印
            </div>

            <div
                class="statusValue"
                id="sealCount">
                0 / 3
            </div>

        </div>


        <div class="statusBox">

            <div class="statusLabel">
                TIME
            </div>

            <div
                class="statusValue"
                id="timer">
                30
            </div>

        </div>


        <div class="statusBox">

            <div class="statusLabel">
                LIFE
            </div>

            <div
                class="statusValue"
                id="life">
                ❤️❤️❤️
            </div>

        </div>

    </div>


    <!-- 魔法陣 -->

    <div
        class="magicCircle"
        id="magicCircle">

        <div class="magicCore">

            <div
                class="lock"
                id="lock">
                🔒
            </div>

            <div
                class="sealText"
                id="sealText">
                第1の封印
            </div>

        </div>


        <div
            class="sequence"
            id="sequence">
        </div>

    </div>


    <div
        class="message"
        id="message">

        センサーを開始してください

    </div>


    <div class="buttons">

        <button id="sensorBtn">
            📱 センサー開始
        </button>

        <button id="startBtn">
            🔮 開始
        </button>

        <button id="resetBtn">
            🔄
        </button>

    </div>


    <div class="help">

        PC：← → ↑ ↓ キー / スペースキー

    </div>

</div>


<!-- 結果画面 -->

<div
    class="overlay"
    id="overlay">

    <div class="result">

        <h2 id="resultTitle">
            🔓 OPEN!
        </h2>

        <p id="resultText">
        </p>

        <button id="againBtn">
            もう一度挑戦
        </button>

    </div>

</div>


<script>

/* =========================================
   DOM
========================================= */

const sensorBtn =
    document.getElementById("sensorBtn");

const startBtn =
    document.getElementById("startBtn");

const resetBtn =
    document.getElementById("resetBtn");

const againBtn =
    document.getElementById("againBtn");

const sealCount =
    document.getElementById("sealCount");

const timer =
    document.getElementById("timer");

const life =
    document.getElementById("life");

const message =
    document.getElementById("message");

const sequence =
    document.getElementById("sequence");

const sealText =
    document.getElementById("sealText");

const lock =
    document.getElementById("lock");

const magicCircle =
    document.getElementById("magicCircle");

const overlay =
    document.getElementById("overlay");

const resultTitle =
    document.getElementById("resultTitle");

const resultText =
    document.getElementById("resultText");


/* =========================================
   封印データ
========================================= */

const seals = [

    {
        name: "第1の封印",
        sequence: ["←", "→", "←"]
    },

    {
        name: "第2の封印",
        sequence: ["↑", "↓", "↑", "→"]
    },

    {
        name: "第3の封印",
        sequence: ["→", "←", "↑", "↓", "→"]
    }

];


/* =========================================
   ゲーム状態
========================================= */

let currentSeal = 0;

let currentIndex = 0;

let playerLife = 3;

let timeLeft = 30;

let gameStarted = false;

let sensorEnabled = false;

let timerInterval = null;

let lastDirection = null;

let lastDirectionTime = 0;

let lastShakeTime = 0;


/* =========================================
   魔法陣を表示
========================================= */

function createSequence() {

    const data =
        seals[currentSeal];

    sequence.innerHTML = "";

    currentIndex = 0;


    data.sequence.forEach(
        (direction, index) => {

            const step =
                document.createElement("div");

            step.className =
                "step";

            step.textContent =
                direction;

            if (index === 0) {

                step.classList.add(
                    "current"
                );

            }

            sequence.appendChild(step);

        }
    );


    sealText.textContent =
        data.name;

    lock.textContent =
        "🔒";

}


/* =========================================
   ステータス
========================================= */

function updateStatus() {

    sealCount.textContent =
        `${currentSeal} / 3`;

    timer.textContent =
        timeLeft;

    life.textContent =
        "❤️".repeat(playerLife) +
        "🖤".repeat(3 - playerLife);

}


/* =========================================
   ゲーム開始
========================================= */

function startGame() {

    if (gameStarted) {
        return;
    }

    gameStarted = true;

    currentSeal = 0;

    currentIndex = 0;

    playerLife = 3;

    timeLeft = 30;

    updateStatus();

    createSequence();

    message.textContent =
        "魔法陣の動きを再現してください！";


    clearInterval(timerInterval);


    timerInterval =
        setInterval(() => {

            if (!gameStarted) {
                return;
            }

            timeLeft--;

            updateStatus();

            if (timeLeft <= 0) {

                gameOver();

            }

        }, 1000);

}


/* =========================================
   ジェスチャー入力
========================================= */

function inputGesture(direction) {

    if (!gameStarted) {
        return;
    }


    const data =
        seals[currentSeal];

    const expected =
        data.sequence[currentIndex];


    /* =========================
       正解
    ========================= */

    if (direction === expected) {

        const steps =
            document.querySelectorAll(
                ".step"
            );


        steps[currentIndex]
            .classList.remove("current");

        steps[currentIndex]
            .classList.add("done");


        currentIndex++;


        /* 封印解除 */

        if (
            currentIndex >=
            data.sequence.length
        ) {

            unlockSeal();

            return;

        }


        steps[currentIndex]
            .classList.add("current");


        message.textContent =
            "✨ 正解！次の動き！";

        return;

    }


    /* =========================
       ミス
    ========================= */

    playerLife--;

    updateStatus();

    message.textContent =
        `❌ 違う！「${expected}」です！`;


    const steps =
        document.querySelectorAll(
            ".step"
        );


    if (steps[currentIndex]) {

        steps[currentIndex]
            .classList.add("wrong");

        setTimeout(() => {

            steps[currentIndex]
                ?.classList.remove("wrong");

        }, 300);

    }


    if (playerLife <= 0) {

        gameOver();

    }

}


/* =========================================
   封印解除
========================================= */

function unlockSeal() {

    currentSeal++;

    updateStatus();


    magicCircle.classList.remove(
        "opening"
    );

    void magicCircle.offsetWidth;

    magicCircle.classList.add(
        "opening"
    );


    lock.textContent =
        "✨";


    message.textContent =
        "✨ 封印解除！！";


    /* =========================
       全封印解除
    ========================= */

    if (currentSeal >= 3) {

        setTimeout(() => {

            gameClear();

        }, 900);

        return;

    }


    /* =========================
       次の封印
    ========================= */

    setTimeout(() => {

        createSequence();

        message.textContent =
            "次の封印を解除せよ！";

    }, 900);

}


/* =========================================
   クリア
========================================= */

function gameClear() {

    gameStarted = false;

    clearInterval(timerInterval);

    resultTitle.textContent =
        "🔓 金庫OPEN！";

    resultText.innerHTML =
        `すべての封印を解除した！<br><br>
         <strong>✨ 魔法金庫の秘密を解き明かした！ ✨</strong><br><br>
         残り時間：${timeLeft}秒`;

    overlay.classList.add(
        "show"
    );

    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: "minigame", type: "clear" }, "*");
    }

}


/* =========================================
   ゲームオーバー
========================================= */

function gameOver() {

    gameStarted = false;

    clearInterval(timerInterval);

    resultTitle.textContent =
        "💀 GAME OVER";

    resultText.innerHTML =
        `封印解除：${currentSeal} / 3<br><br>
         もう一度挑戦しよう！`;

    overlay.classList.add(
        "show"
    );

}


/* =========================================
   センサー開始
========================================= */

async function enableSensor() {

    try {

        /*
            iPhone / iPad
        */

        if (
            typeof DeviceOrientationEvent !==
                "undefined" &&

            typeof DeviceOrientationEvent
                .requestPermission ===
                "function"
        ) {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if (
                permission !==
                "granted"
            ) {

                message.textContent =
                    "センサーが許可されませんでした。";

                return;

            }

        }


        window.addEventListener(
            "deviceorientation",
            handleOrientation
        );


        window.addEventListener(
            "devicemotion",
            handleMotion
        );


        sensorEnabled = true;


        sensorBtn.textContent =
            "📱 センサーON";

        sensorBtn.disabled = true;


        message.textContent =
            "センサー準備完了！";

    }

    catch (error) {

        console.error(error);

        message.textContent =
            "センサーを利用できませんでした。";

    }

}


/* =========================================
   傾き判定
========================================= */

function handleOrientation(event) {

    if (!sensorEnabled) {
        return;
    }


    const gamma =
        event.gamma || 0;

    const beta =
        event.beta || 0;


    let direction = null;


    /*
        左右
    */

    if (gamma > 20) {

        direction = "→";

    }

    else if (gamma < -20) {

        direction = "←";

    }


    /*
        上下
    */

    else if (beta > 65) {

        direction = "↓";

    }

    else if (beta < 25) {

        direction = "↑";

    }


    if (direction !== null) {

        registerDirection(
            direction
        );

    }

}


/* =========================================
   入力間隔調整
========================================= */

function registerDirection(direction) {

    const now =
        performance.now();


    /*
        同じ方向の連続検出を防ぐ
    */

    if (
        direction === lastDirection &&
        now - lastDirectionTime < 500
    ) {

        return;

    }


    lastDirection =
        direction;

    lastDirectionTime =
        now;


    inputGesture(direction);

}


/* =========================================
   シェイク
========================================= */

function handleMotion(event) {

    if (!sensorEnabled) {
        return;
    }


    const acc =
        event.accelerationIncludingGravity;


    if (!acc) {
        return;
    }


    const x =
        Math.abs(acc.x || 0);

    const y =
        Math.abs(acc.y || 0);

    const z =
        Math.abs(acc.z || 0);


    const power =
        x + y + z;


    if (power > 35) {

        const now =
            performance.now();


        if (
            now - lastShakeTime >
            700
        ) {

            lastShakeTime =
                now;


            /*
                現在のゲームでは
                シェイク = ↑
            */

            inputGesture("↑");

        }

    }

}


/* =========================================
   PC操作
========================================= */

document.addEventListener(
    "keydown",
    event => {

        if (!gameStarted) {
            return;
        }


        const keyMap = {

            ArrowUp: "↑",

            ArrowDown: "↓",

            ArrowLeft: "←",

            ArrowRight: "→"

        };


        if (
            keyMap[event.key]
        ) {

            inputGesture(
                keyMap[event.key]
            );

        }


        /*
            スペース
            = シェイク
        */

        if (
            event.code ===
            "Space"
        ) {

            inputGesture("↑");

        }

    }
);


/* =========================================
   リセット
========================================= */

function resetGame() {

    clearInterval(
        timerInterval
    );

    currentSeal = 0;

    currentIndex = 0;

    playerLife = 3;

    timeLeft = 30;

    gameStarted = false;

    overlay.classList.remove(
        "show"
    );

    updateStatus();

    createSequence();

    message.textContent =
        sensorEnabled
        ? "「開始」を押してください"
        : "「センサー開始」を押してください";

}


/* =========================================
   ボタン
========================================= */

sensorBtn.addEventListener(
    "click",
    enableSensor
);


startBtn.addEventListener(
    "click",
    startGame
);


resetBtn.addEventListener(
    "click",
    resetGame
);

againBtn.addEventListener("click", () => {
    resetGame();
});


/* =========================================
   初期化
========================================= */

createSequence();

updateStatus();

</script>

</body>
</html>
