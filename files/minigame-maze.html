<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>傾け迷路</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        background: #111827;
        color: white;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .game-container {
        width: min(94vw, 500px);
        text-align: center;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 28px;
    }

    .description {
        font-size: 14px;
        color: #cbd5e1;
        margin-bottom: 12px;
    }

    .status {
        display: flex;
        justify-content: space-between;
        background: #1f2937;
        border-radius: 12px;
        padding: 10px 15px;
        margin-bottom: 12px;
        font-size: 15px;
    }

    .status span {
        font-weight: bold;
    }

    #maze {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #e5e7eb;
        border: 5px solid #374151;
        border-radius: 12px;
        overflow: hidden;
        touch-action: none;
    }

    .wall {
        position: absolute;
        background: #374151;
        border-radius: 3px;
    }

    .goal {
        position: absolute;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(34, 197, 94, 0.8);
    }

    .goal::after {
        content: "★";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 20px;
    }

    #ball {
        position: absolute;
        background: #ef4444;
        border-radius: 50%;
        box-shadow:
            0 3px 8px rgba(0,0,0,0.35),
            inset -3px -3px 5px rgba(0,0,0,0.2),
            inset 3px 3px 5px rgba(255,255,255,0.4);
        z-index: 10;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    button {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 14px 10px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        background: #2563eb;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.97);
    }

    #sensorBtn {
        background: #f59e0b;
    }

    #restartBtn {
        background: #64748b;
    }

    .message {
        min-height: 28px;
        margin-top: 10px;
        font-weight: bold;
    }

    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.75);
        display: none;
        justify-content: center;
        align-items: center;
        padding: 25px;
        z-index: 100;
    }

    .overlay.show {
        display: flex;
    }

    .result {
        width: min(90vw, 380px);
        background: #1f2937;
        border-radius: 20px;
        padding: 30px 20px;
        text-align: center;
    }

    .result h2 {
        font-size: 30px;
        margin: 0 0 15px;
    }

    .result p {
        color: #cbd5e1;
        line-height: 1.7;
    }

    #playAgain {
        margin-top: 10px;
        background: #22c55e;
    }

    .hint {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="game-container">

    <h1>📱 傾け迷路</h1>

    <div class="description">
        スマホを傾けて赤いボールをゴールまで運ぼう！
    </div>

    <div class="status">
        <div>⏱️ <span id="time">0.0</span>秒</div>
        <div>🏆 <span id="statusText">プレイ中</span></div>
    </div>

    <div id="maze">

        <!-- ゴール -->
        <div
            class="goal"
            id="goal">
        </div>

        <!-- 壁 -->
        <div class="wall"
             style="left:20%; top:0%; width:8%; height:55%;">
        </div>

        <div class="wall"
             style="left:20%; top:55%; width:50%; height:8%;">
        </div>

        <div class="wall"
             style="left:70%; top:20%; width:8%; height:43%;">
        </div>

        <div class="wall"
             style="left:40%; top:20%; width:38%; height:8%;">
        </div>

        <div class="wall"
             style="left:40%; top:20%; width:8%; height:25%;">
        </div>

        <div class="wall"
             style="left:40%; top:75%; width:38%; height:8%;">
        </div>

        <div class="wall"
             style="left:78%; top:63%; width:8%; height:20%;">
        </div>

        <div class="wall"
             style="left:10%; top:75%; width:8%; height:25%;">
        </div>

        <!-- ボール -->
        <div id="ball"></div>

    </div>

    <div class="buttons">
        <button id="sensorBtn">
            📱 センサーを開始
        </button>

        <button id="restartBtn">
            🔄 リスタート
        </button>
    </div>

    <div class="message" id="message">
        「センサーを開始」を押してください
    </div>

    <div class="hint">
        ※ PCでは矢印キーでも操作できます
    </div>

</div>


<!-- クリア画面 -->
<div class="overlay" id="overlay">

    <div class="result">

        <h2>🎉 CLEAR!</h2>

        <p>
            ゴールに到着しました！
        </p>

        <p>
            クリアタイム<br>
            <strong id="clearTime">0.0</strong> 秒
        </p>

        <button id="playAgain">
            もう一度遊ぶ
        </button>

    </div>

</div>


<script>

/* =========================
   基本設定
========================= */

const maze = document.getElementById("maze");
const ball = document.getElementById("ball");
const goal = document.getElementById("goal");

const timeDisplay = document.getElementById("time");
const statusText = document.getElementById("statusText");
const message = document.getElementById("message");

const sensorBtn = document.getElementById("sensorBtn");
const restartBtn = document.getElementById("restartBtn");

const overlay = document.getElementById("overlay");
const clearTime = document.getElementById("clearTime");
const playAgain = document.getElementById("playAgain");


/* =========================
   ゲーム状態
========================= */

let ballX = 40;
let ballY = 40;

let velocityX = 0;
let velocityY = 0;

let sensorEnabled = false;
let gameStarted = false;
let gameCleared = false;

let startTime = 0;
let elapsedTime = 0;


/* =========================
   ボールサイズ
========================= */

function updateBallSize() {

    const size = maze.clientWidth * 0.055;

    ball.style.width = size + "px";
    ball.style.height = size + "px";

}


/* =========================
   ゴール設定
========================= */

function updateGoalSize() {

    const size = maze.clientWidth * 0.09;

    goal.style.width = size + "px";
    goal.style.height = size + "px";

    goal.style.left = "88%";
    goal.style.top = "88%";

}


/* =========================
   壁を取得
========================= */

function getWalls() {

    return [...document.querySelectorAll(".wall")];

}


/* =========================
   矩形取得
========================= */

function getRect(element) {

    const mazeRect = maze.getBoundingClientRect();
    const rect = element.getBoundingClientRect();

    return {
        left: rect.left - mazeRect.left,
        top: rect.top - mazeRect.top,
        right: rect.right - mazeRect.left,
        bottom: rect.bottom - mazeRect.top
    };

}


/* =========================
   ボールの矩形
========================= */

function getBallRect(x, y) {

    const size = ball.offsetWidth;

    return {
        left: x,
        top: y,
        right: x + size,
        bottom: y + size
    };

}


/* =========================
   衝突判定
========================= */

function isColliding(a, b) {

    return (
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    );

}


/* =========================
   壁との衝突
========================= */

function checkWallCollision(x, y) {

    const ballRect = getBallRect(x, y);

    const walls = getWalls();

    for (const wall of walls) {

        const wallRect = getRect(wall);

        if (isColliding(ballRect, wallRect)) {
            return true;
        }

    }

    return false;

}


/* =========================
   ゴール判定
========================= */

function checkGoal() {

    const ballRect = getBallRect(ballX, ballY);
    const goalRect = getRect(goal);

    return isColliding(ballRect, goalRect);

}


/* =========================
   ボール描画
========================= */

function drawBall() {

    ball.style.left = ballX + "px";
    ball.style.top = ballY + "px";

}


/* =========================
   ゲーム開始
========================= */

function startGame() {

    if (gameStarted || gameCleared) {
        return;
    }

    gameStarted = true;
    startTime = performance.now();

    statusText.textContent = "プレイ中";
    message.textContent = "スマホを傾けてボールを動かそう！";

}


/* =========================
   ゲームリセット
========================= */

function resetGame() {

    ballX = 40;
    ballY = 40;

    velocityX = 0;
    velocityY = 0;

    gameStarted = false;
    gameCleared = false;

    elapsedTime = 0;

    overlay.classList.remove("show");

    timeDisplay.textContent = "0.0";
    statusText.textContent = "待機中";

    message.textContent =
        sensorEnabled
        ? "スマホを傾けてスタート！"
        : "「センサーを開始」を押してください";

    drawBall();

}


/* =========================
   クリア
========================= */

function clearGame() {

    gameCleared = true;

    statusText.textContent = "CLEAR!";

    clearTime.textContent = elapsedTime.toFixed(1);

    overlay.classList.add("show");

    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: "minigame", type: "clear" }, "*");
    }

}


/* =========================
   タイマー
========================= */

function updateTimer(now) {

    if (!gameStarted || gameCleared) {
        return;
    }

    elapsedTime = (now - startTime) / 1000;

    timeDisplay.textContent =
        elapsedTime.toFixed(1);

}


/* =========================
   ボール移動
========================= */

function moveBall() {

    if (!gameStarted || gameCleared) {
        return;
    }

    const maxX = maze.clientWidth - ball.offsetWidth;
    const maxY = maze.clientHeight - ball.offsetHeight;

    let nextX = ballX + velocityX;
    let nextY = ballY + velocityY;


    /* 画面外に出ないようにする */

    nextX = Math.max(0, Math.min(maxX, nextX));
    nextY = Math.max(0, Math.min(maxY, nextY));


    /* 壁との衝突 */

    if (!checkWallCollision(nextX, ballY)) {
        ballX = nextX;
    } else {
        velocityX = 0;
    }


    if (!checkWallCollision(ballX, nextY)) {
        ballY = nextY;
    } else {
        velocityY = 0;
    }


    drawBall();


    /* ゴール */

    if (checkGoal()) {
        clearGame();
    }

}


/* =========================
   センサー
========================= */

function handleOrientation(event) {

    if (!sensorEnabled) {
        return;
    }

    /*
        gamma = 左右の傾き
        beta  = 前後の傾き
    */

    let gamma = event.gamma || 0;
    let beta = event.beta || 0;


    /*
        傾きすぎないように制限
    */

    gamma = Math.max(-45, Math.min(45, gamma));
    beta = Math.max(-45, Math.min(45, beta));


    /*
        ボール速度

        gamma → 左右
        beta  → 上下
    */

    velocityX = gamma * 0.035;
    velocityY = beta * 0.035;


    if (!gameStarted) {
        startGame();
    }

}


/* =========================
   センサー開始
========================= */

async function enableSensor() {

    try {

        /*
            iPhone / iPadでは
            permissionが必要な場合がある
        */

        if (
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ) {

            const permission =
                await DeviceOrientationEvent.requestPermission();

            if (permission !== "granted") {

                message.textContent =
                    "センサーの使用が許可されませんでした。";

                return;

            }

        }


        window.addEventListener(
            "deviceorientation",
            handleOrientation
        );


        sensorEnabled = true;

        sensorBtn.textContent = "📱 センサーON";

        sensorBtn.disabled = true;

        message.textContent =
            "スマホを傾けてボールを動かそう！";


    } catch (error) {

        console.error(error);

        message.textContent =
            "センサーを利用できませんでした。";

    }

}


/* =========================
   PC用キーボード操作
========================= */

document.addEventListener("keydown", (event) => {

    if (!gameStarted) {
        startGame();
    }

    const speed = 0.8;

    if (event.key === "ArrowLeft") {
        velocityX = -speed;
    }

    if (event.key === "ArrowRight") {
        velocityX = speed;
    }

    if (event.key === "ArrowUp") {
        velocityY = -speed;
    }

    if (event.key === "ArrowDown") {
        velocityY = speed;
    }

});


document.addEventListener("keyup", (event) => {

    if (
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight"
    ) {
        velocityX = 0;
    }

    if (
        event.key === "ArrowUp" ||
        event.key === "ArrowDown"
    ) {
        velocityY = 0;
    }

});


/* =========================
   ボタン
========================= */

sensorBtn.addEventListener(
    "click",
    enableSensor
);

restartBtn.addEventListener(
    "click",
    resetGame
);

playAgain.addEventListener("click", () => {
    resetGame();
});


/* =========================
   ゲームループ
========================= */

function gameLoop(now) {

    updateTimer(now);

    moveBall();

    requestAnimationFrame(gameLoop);

}


/* =========================
   初期化
========================= */

function init() {

    updateBallSize();
    updateGoalSize();

    drawBall();

    requestAnimationFrame(gameLoop);

}


/* =========================
   画面サイズ変更
========================= */

window.addEventListener(
    "resize",
    () => {

        updateBallSize();
        updateGoalSize();

        /*
            リサイズ時に
            ボールが画面外に出ないようにする
        */

        const maxX =
            maze.clientWidth - ball.offsetWidth;

        const maxY =
            maze.clientHeight - ball.offsetHeight;

        ballX = Math.min(ballX, maxX);
        ballY = Math.min(ballY, maxY);

        drawBall();

    }
);


init();

</script>

</body>
</html>
